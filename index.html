            "生活インフラ維持政策の検討",
            "地域再編テーマの整理"
          ]
        },
        {
          ward: "八幡西区",
          cluster: "A: 都市サービス型",
          summary: "住宅・商業・業務機能が広く分布するエリア",
          youthratio: 10.7,
          workingratio: 56.8,
          elderlyratio: 32.3,
          secondaryratio: 28.8,
          tertiaryratio: 71.1,
          suggestions: [
            "商業・生活サービス需要の分析",
            "地域拠点機能の再整理",
            "高齢化を踏まえた複合施策の検討"
          ]
        }
      ]
    };

    const citySelect = document.getElementById("citySelect");
    const wardSelect = document.getElementById("wardSelect");
    const showButton = document.getElementById("showButton");
    const resultArea = document.getElementById("resultArea");

    function updateWardOptions() {
      const selectedCity = citySelect.value;
      const wards = areaData[selectedCity];

      wardSelect.innerHTML = "";

      wards.forEach((item, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = item.ward;
        wardSelect.appendChild(option);
      });
    }

    function getDiagnosticComment(data) {
        let comment = "";

        if (data.cluster.includes("都市サービス型")) {
            comment = "第三次産業比率が高く、都心・副都心機能や商業・サービス需要との接続がしやすいエリアです。";

            if (data.tertiaryratio >= 90) {
                comment += " 特にサービス業集積が非常に高く、再開発、商圏分析、新規出店検討との相性が強いと考えられます。";
            } else if (data.workingratio >= 65) {
                comment += " 生産年齢人口比も高めで、業務機能や通勤流動を踏まえた需要分析にも向いています。";
            }
        }

        else if (data.cluster.includes("高齢住宅地型")) {
            comment = "老年人口比が高く、郊外住宅地として生活支援・医療介護・地域交通の検討余地が大きいエリアです。";

            if (data.elderlyratio >= 30) {
                comment += " 高齢化がかなり進んでおり、移動支援、買い物支援、医療介護需要の把握を優先しやすいと考えられます。";
            } else if (data.tertiaryratio >= 85){
                comment += " 一方で第三次産業比率も一程度高く、生活サービス維持の観点から商圏分析と組み合わせる余地があります。";
            }
        }

        else if (data.cluster.includes("工業・産業ミックス型")) {
            comment = "第二次産業比率が比較的高く、工業・物流・住宅地機能が重なる産業ミックス型エリアです。";

            if (data.secondaryratio >= 25) {
                comment += " 特に産業集積の色が強く、GX、物流、産業高度化、人材需給分析との接続が有力です。";
            } else if (data.youthratio >= 13) {
                comment += "若年人口比も比較的高く、新興住宅地や成長エリアとしての需要も併せて捉える必要があります。";
            }
        }

        else {
            comment = "人口構成と産業構成のバランスを踏まえて、複合的な提案を検討できるエリアです。";
        }

        return comment;
    }
    
    <!--有望テーマ-->
    function getSuggestions(data) {
      if (data.suggestions && data.suggestions.length > 0) {
        return data.suggestions;
      }

      let suggestions = [];

        if (data.cluster.includes("都市サービス型")) {
            suggestions = [
                "商業・サービス需要の可視化",
                "再開発・新規店舗出店候補地の優先度分析",
                "人流・商圏データを組み合わせた需要推定"
            ];
        }

        else if (data.cluster.includes("高齢住宅地型")) {
            suggestions = [
                "医療・介護需要の把握",
                "移動支援・買い物支援の優先度分析",
                "空き家活用・住宅地維持施策の整理"
            ];
        }

        else if (data.cluster.includes("工業・産業ミックス型")) {
            suggestions = [
                "GX投資ターゲットの候補の抽出",
                "物流・産業拠点の立地評価",
                "産業×人材需給ミスマッチの可視化"
            ];
        }

        else {
            suggestions = [
                "地域課題の仮設整理",
                "人口構成と産業構成を踏まえた基礎分析",
            ];
        }

        return suggestions;
    }

    
    
    //想定顧客
    function getCustomer(data) {
        let customers = [];

        if (data.cluster.includes("都市サービス型")) {
            customers = [
                "自治体の都市政策・再開発部門",
                "商業施設ディベロッパー・小売事業者",
                "商圏分析を行う事業企画部門"
            ];
        } else if (data.cluster.includes("高齢住宅地型")) {
            customers = [
                "自治体の都市政策・再開発部門",
                "医療・介護・生活支援サービス事業者",
                "住宅地維持や空き家対策を担う地域政策部門"
            ];
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            customers = [
                "自治体の産業振興・GX推進部門",
                "物流・製造関連企業の事業開発部門",
                "雇用・産業構造転換を扱う支援機関"
            ];
        } else {
            customers = [
                "地域調査を行う企画部門",
                "エリア戦略を考える事業企画担当"
            ];
        }

        return customers;
    }

    // 追加データ候補
    function getAdditionalData(data) {
        let items = [];

        if (data.cluster.includes("都市サービス型")) {
            items =[
                "人流データ",
                "昼夜間人口",
                "商圏・消費データ"
            ];
        } else if (data.cluster.includes("高齢住宅地型")) {
            items = [
                "高齢者人口の将来推計",
                "交通空白地データ(駅から半径500m〜1000m、バス停から半径300m〜500m以上に住宅が点在する地域を指す)",
                "医療・介護施設分布"
            ];
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            items = [
                "工業統計・事業所データ",
                "物流拠点・交通アクセス",
                "雇用・通勤流動データ"
            ];
        } else {
            items = [
                "人口推計",
                "事業所統計"
            ];
        }

        return items;
    }

    // プレゼンでの見せ方
    function getPitchPoint(data) {
        if (data.cluster.includes("都市サービス型")) {
            return "商業・サービス需要が高いエリアとして、再開発や出店余地を定量的に示す。";
        } else if (data.cluster.includes("高齢住宅地型")) {
            return "高齢化と生活支援需要を軸に、地域交通・医療介護施策の必要性を示す。";
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            return "産業集積と雇用・物流の観点から、GXや産業高度化の提案予知を示す。";
        } else {
            return "人口構成と産業構成の特徴から、基礎的な地域課題を整理して示す。"
        }
    }

    // 需要タイプ
    function getDemandType(data) {
        if (data.cluster.includes("都市サービス型")) {
            return "都市サービス・商業需要型";
        } else if (data.cluster.includes("高齢住宅地型")) {
            return "生活支援・高齢者サービス需要型";
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            return "産業集積・GX転換需要型";
        } else {
            return "複合需要型";
        }
    }

    // 提案難易度
    function getProposalDifficulty(data) {
        if (data.cluster.includes("都市サービス型")) {
            return "中";
        } else if (data.cluster.includes("高齢住宅地型")) {
            return "中～高";
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            return "高";
        } else {
            return "中";
        }
    }

    // 優先度の軸
    function getPriorityAxis(data) {
        if (data.cluster.includes("都市サービス型")) {
            return "サービス需要の大きさ、再開発余地、商圏ポテンシャル";
        } else if (data.cluster.includes("高齢住宅地型")) {
            return "高齢化率、生活支援需要、移動・交通課題の大きさ";
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            return "第二次産業比率、産業集積、GX・物流転換余地";
        } else {
            return "人口構成と産業構成のバランス";
        }
    }

    // 地域課題
    function getRegionalIssues(data) {
        let issues = [];

        if (data.cluster.includes("都市サービス型")) {
            issues = [
                "都心・副都心への集積機能を踏まえた需要把握",
                "再開発・新規出店余地の見極め",
                "人流や証券競争を踏まえたサービス供給最適化"
            ];
        } else if (data.cluster.includes("高齢住宅地型")) {
            issues = [
                "高齢化進行に伴う医療、介護、生活支援需要への対応",
                "移動弱者や地域交通の維持",
                "空き家活用や住宅地の持続性確保"
            ];
        } else if (data.cluster.includes("工業・産業ミックス型")) {
            issues = [
                "産業構造転換とGX投資の方向性整理",
                "物流・製造拠点としての機能強化",
                "産業人材の需給ミスマッチへの対応"
            ];
        } else {
            issues = [
                "地域特性に応じた課題の整理",
                "人口構成と産業構成を踏まえた基礎分析"
            ];
        }

         return issues;
    }

   

    function showRecommendation() {
      const selectedCity = citySelect.value;
      const selectedIndex = wardSelect.value;
      const data = areaData[selectedCity][selectedIndex];
      
      const diagnosticComment = getDiagnosticComment(data);
      const customers =getCustomer(data);
      const suggestions = getSuggestions(data);
      const additionalData = getAdditionalData(data);
      const pitchPoint = getPitchPoint(data);

      const demandType = getDemandType(data);
      const proposalDifficulty = getProposalDifficulty(data);
      const priorityAxis = getPriorityAxis(data);
      const regionalIssues = getRegionalIssues(data);

      
      
      const customersHtml = customers.map(item => `<li>${item}</li>`).join("");
      const suggestionsHtml = suggestions.map(item => `<li>${item}</li>`).join("");
      const additionalDataHtml = additionalData.map(item => `<li>${item}</li>`).join("");
      const regionalIssuesHtml = regionalIssues.map(item => `<li>${item}</li>`).join("");

     
     

      resultArea.innerHTML = `
  <h2>${selectedCity} ${data.ward}</h2>

  <h3 class="section-title">診断サマリー</h3>

  <div class="highlight">
    <p><strong>クラスタ:</strong> ${data.cluster}</p>
    <p><strong>エリア要約:</strong> ${data.summary}</p>
  </div>

  <div class="top-grid">
    <div class="info-card">
        <h3>需要タイプ</h3>
        <p>${demandType}</p>
    </div>
    <div class="info-card">
        <h3>提案難易度</h3>
        <p>${proposalDifficulty}</p>
    </div>
    <div class="info-card">
        <h3>優先度の軸</h3>
        <p>${priorityAxis}</p>
    </div>
    <div clas="info-card">
        <h3>タイプ判定</h3>
        <p>${data.cluster}</p>
    </div>                
   </div>


  <div class="info-grid" style="margin-top: 16px;">
    <div class="info-card">
      <h3>人口構成</h3>
      <ul>
        <li>年少人口比: ${data.youthratio}%</li>
        <li>生産年齢人口比: ${data.workingratio}%</li>
        <li>老年人口比: ${data.elderlyratio}%</li>
      </ul>
    </div>

    <div class="info-card">
      <h3>産業構成</h3>
      <ul>
        <li>第二次産業比: ${data.secondaryratio}%</li>
        <li>第三次産業比: ${data.tertiaryratio}%</li>
      </ul>
    </div>
  </div>

  <div class="comment-box">
    <h3>分析コメント</h3>
    <p>${diagnosticComment}</p>
  </div>

  <h3 class="section-title">提案内容</h3>

  <div class="info-card">
    <h3>地域課題</h3>
    <ul>${regionalIssuesHtml}</ul>
  </div>  

  <div class="info-card">
    <h3>想定顧客</h3>
    <ul>${customersHtml}</ul>
  </div>

  <div class="info-card">
    <h3>有望テーマ</h3>
    <ul>${suggestionsHtml}</ul>
  </div>

  <div class="info-card" style="margin-top: 16px;">
    <h3>追加データ候補</h3>
    <ul>${additionalDataHtml}</ul>
  </div>

  <div class="info-card" style="margin-top: 16px;">
    <h3>プレゼンでの見せ方</h3>
    <ul>${pitchPoint}</ul>
  </div>

  <div class="flow-grid">
    <div class="flow-card">
        <span>Data</span>
        <h4>データ分析</h4>
        <p>市比較とクラスタリングで、エリア差を定量化</p>
    </div>
    <div class="flow-card">
        <span>Hypothesis</span>
        <h4>仮説形成</h4>
        <p>タイプ別に地域課題とビジネス機会を整理</p>
    </div>
    <div class="flow-card">
        <span>Organize</span>
        <h4>整理</h4>
        <p>提案前のあたり付けに使える論点に落とし込む</p>
    </div>
    <div class="flow-card">
        <span>Implement</span>
        <h4>実装</h4>
        <p>ブラウザで動く施策ツールとして成果物化</p>
    </div>
`;
     }

    citySelect.addEventListener("change", updateWardOptions);
    showButton.addEventListener("click", showRecommendation);

    updateWardOptions();
  </script>
</body>
</html>
